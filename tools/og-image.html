<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Hanken+Grotesk:wght@400;600&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #FAF6F0; overflow: hidden; position: relative;
         font-family: "Hanken Grotesk", sans-serif; }
  .blob { position: absolute; right: -140px; bottom: -220px; width: 620px; height: 620px;
          border-radius: 999px; background: #E8A48C; opacity: .45; }
  .blob2 { position: absolute; right: 60px; top: -260px; width: 420px; height: 420px;
           border-radius: 999px; background: #F1ECE4; }
  .inner { position: relative; height: 100%; padding: 80px 96px; display: flex;
           flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 64px; height: 64px; display: block; }
  .brand span { font-family: "Bricolage Grotesque", sans-serif; font-size: 52px; font-weight: 600;
                letter-spacing: -.035em; font-variation-settings: "opsz" 48; color: #232B4D; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-size: 76px; line-height: 80px;
       font-weight: 600; letter-spacing: -.035em; font-variation-settings: "opsz" 72;
       color: #232B4D; max-width: 880px; }
  .foot { display: flex; align-items: center; gap: 16px; }
  .foot p { font-size: 26px; line-height: 34px; color: #4A5270; }
  .tag { font-size: 16px; font-weight: 600; letter-spacing: .17em; text-transform: uppercase;
         color: #6B625C; }
  .rule { width: 72px; height: 4px; border-radius: 999px; background: #DE7356; }
</style>
</head>
<body>
<div class="blob"></div><div class="blob2"></div>
<div class="inner">
  <div class="brand"><img src="../assets/img/zenia-isotipo.svg" alt=""><span>zenia</span></div>
  <div style="display:flex;flex-direction:column;gap:28px">
    <div class="rule"></div>
    <h1>Tu rutina de bienestar, en español.</h1>
  </div>
  <div class="foot"><p>Piloto gratuito en Argentina · Cupos limitados</p></div>
</div>
</body>
</html>
